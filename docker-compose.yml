version: '3.8'

services:
  app:
    build: .
    container_name: inventario_app
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - db
      - rabbitmq

  db:
    image: postgres:15-alpine
    container_name: inventario_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: inventario_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
